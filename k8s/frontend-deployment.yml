apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend
        image: sumanthtony/devboard-frontend:latest
        ports:
        - containerPort: 4173

---

kind: Service
apiVersion: v1
metadata:
  name: devboard-frontend-service
  namespace: devboard
spec:
  selector:
    app: devboard-frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 4173  # Pod port
    nodePort: 30080  # Node ka port
  type: NodePort


