#Goal: To ensure all the Dockerfiles and Images are security tested

name: Docker-Scan

on:
  workflow_call:

jobs:
  dockerfile-lint-and-scan:
    runs-on: self-hosted
    strategy:
        fail-fast: false      # If one fails still workflow runs 
        matrix:
          folders: ['frontend', 'backend']
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: ${{ matrix.folders }} Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0            # Hadolint security tool will check Dockerfile vulnerabilities, syntax and issues
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile

      - name: Docker login setup
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build ${{ matrix.folders }}
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest .
        working-directory: ${{ matrix.folders }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

