#Goal: To ensure all the Dockerfiles and Images are security tested

name: Docker-Scan

on:
  workflow_call:

jobs:
  dockerfile-lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false       
        matrix:
          folders: ['frontend', 'backend']
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: ${{ matrix.folders }} Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0            # Hadolint security tool will check Dockerfile vulnerabilities, syntax and issues
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile

      - name: Docker login setup
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build ${{ matrix.folders }}
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.folders }}:latest
        working-directory: ${{ matrix.folders }}

          #docker-image-scan:
