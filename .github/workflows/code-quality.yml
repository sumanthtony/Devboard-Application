#Goal: To so SAST for my code

name: Code-Quality

on:
  workflow_call:

  # FRONTEND - Nodejs

jobs:
  sast:
    runs-on: self-hosted
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Run Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test
        working-directory: frontend


  # BACKEND - GO lang
  
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Go lang
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run Go Formatter
        run: go fmt
        working-directory: backend

      - name: Run Go Vet
        run: go vet
        working-directory: backend

      - name: Run go Test
        run: go test
        working-directory: backend 
