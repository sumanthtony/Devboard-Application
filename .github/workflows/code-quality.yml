# Goal: I have to do SAST for my code

 name: Code-Quality

 on:
   workflow_call:   # We can call this workflow on before/after any workflow

# FRONTEND - Nodejs
jobs:
  sast:
    runs-on: ubuntu-latest
    #strategy:
     # matrix:
        #fail-fast: false
        #languages: ['node', 'go']
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install npm Packages
        run: npm install
        working-directory: frontend

      - name: Run Linter
        run: run npm lint
        working-directory: frontend

# BACKEND - Go lang

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
           go-version: ${{ matrix.go }}
           go-version-file: 'go.mod'
           cache-dependency-path: go.sum
            
      - name: Run Go Formatter
        run: go fmt
        working-directory: backend

      - name: Run Go Vet
        run: go vet
        working-directory: backend
            
      - name: Run Tests
        run: go test 
        working-directory: backend



